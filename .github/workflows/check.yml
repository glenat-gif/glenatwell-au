name: Check for a new report

# Runs every morning. Most days it finds nothing and stops. After an
# end-of-month meeting it drafts the report, cuts the clip and opens a pull
# request for review. Nothing goes public until that pull request is merged
# with `status: published` and a YouTube ID in the report file.

on:
  schedule:
    - cron: "17 22 * * *"      # about 8 or 9 am in Melbourne
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Find drafts already waiting for review
        id: waiting
        run: |
          dates=$(git ls-remote --heads origin 'report/*' | sed 's#.*refs/heads/report/##' | tr '_\n' '  ')
          echo "dates=$dates" >> "$GITHUB_OUTPUT"

      - name: Look for a new report
        id: check
        run: python -m pipeline.run check --skip ${{ steps.waiting.outputs.dates }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Keep the clip for download
        if: steps.check.outputs.new != ''
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips/
          retention-days: 30

      - name: Open a pull request with the draft
        if: steps.check.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.check.outputs.new }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="report/${NEW// /_}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content data
          git commit -m "Draft councillor report: $NEW"
          git push origin "$branch"
          gh pr create --title "Councillor report draft: $NEW" --body "$(cat <<EOF
          A new councillor report was found on the council webcast.

          Before merging:
          1. Download the clip from the run's artifacts ($RUN_URL) and watch it. If it starts or ends badly, change \`clip_start\` or \`clip_end\` in the report file and run the **Cut clips** workflow.
          2. Upload the clip to YouTube. The \`.txt\` file beside it has a title and description to paste.
          3. In the report file: paste the YouTube ID after \`youtube:\`, fix the transcript and summary, clear the \`check:\` line, and change \`status: draft\` to \`status: published\`.
          4. Merge. The site rebuilds and the report goes live.
          EOF
          )"

      - name: Record meetings with no report
        if: steps.check.outputs.new == ''
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Record checked meetings"
            git push
          fi
